packages:
  - "apps/*"
  - "packages/*"

# O pnpm bloqueia postinstall de dependência por padrão — bom default.
# O esbuild precisa do dele para baixar o binário da plataforma; é usado pelo
# drizzle-kit e pelo vitest. Aprovado explicitamente, e só ele.
allowBuilds:
  '@prisma/client': set this to true or false
  better-sqlite3: set this to true or false
  esbuild: true

minimumReleaseAgeExclude:
  - '@better-auth/drizzle-adapter@1.7.3'
  - better-auth@1.7.3
